[project]
name = "task-list-prototype"
version = "0.1.0"
description = "Core task management slice for a browser-local to-do list prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
task-list-app = "todo_app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_app"]

[project]
name = "small-app"
version = "0.1.0"
description = "Single-list task management baseline SPA for work item F1."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
todo-app = "todo_app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_app"]
